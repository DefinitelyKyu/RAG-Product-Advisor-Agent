services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  ui:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - api
    env_file:
      - .env
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0